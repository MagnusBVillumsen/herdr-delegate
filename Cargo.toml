[package]
name = "herdr-delegate"
version = "0.1.0"
edition = "2024"
description = "Let one coding agent hand a task to another in a Herdr pane and get its answer back"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MagnusBVillumsen/herdr-delegate"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
